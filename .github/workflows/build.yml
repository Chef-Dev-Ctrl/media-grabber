name: Build

# Every push to main builds the Mac (Apple Silicon + Intel) and Windows apps and keeps them as
# downloadable artifacts on the run. Pushing a tag like v1.0.1 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app and disk image
        run: bash build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MediaGrabber-mac-${{ matrix.arch }}
          path: installer/*.dmg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Bundle ffmpeg
        shell: pwsh
        run: |
          python -m pip install --quiet imageio-ffmpeg
          New-Item -ItemType Directory -Force vendor | Out-Null
          Copy-Item (python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())") vendor\ffmpeg.exe
          & vendor\ffmpeg.exe -hide_banner -version | Select-Object -First 1
      - name: Build app and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaGrabber-windows
          path: |
            installer/*.exe
            installer/READ ME FIRST.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.dmg
            out/*.exe
            out/READ ME FIRST.txt
          generate_release_notes: true
